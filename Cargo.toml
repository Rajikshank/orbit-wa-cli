[package]
name = "orbit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first WhatsApp CLI and durable event mirror"
license = "MIT"
repository = "https://github.com/Rajikshank/orbit-wa-cli"
readme = "README.md"
keywords = ["whatsapp", "cli", "local-first", "sqlite"]
categories = ["command-line-utilities"]
exclude = ["docs/**"]

[lib]
name = "orbit_core"
path = "src/lib.rs"

[[bin]]
name = "orbit"
path = "src/bin/orbit.rs"

[[bin]]
name = "orbitd"
path = "src/bin/orbitd.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
flate2 = "1.1"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zip = { version = "4.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.21"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
